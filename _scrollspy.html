<script>
// Highlight the navbar item of the section currently in view, and close the
// mobile menu after a section link is clicked.
document.addEventListener("DOMContentLoaded", function () {
  var links = Array.from(document.querySelectorAll("#navbarCollapse .nav-link[href*='front.html#']"));
  var targets = links.map(function (link) {
    return document.getElementById(link.getAttribute("href").split("#")[1]);
  });

  function update() {
    var offset = Math.min(window.innerHeight * 0.35, 250);
    var current = 0;
    targets.forEach(function (el, i) {
      if (el && el.getBoundingClientRect().top - offset <= 0) current = i;
    });
    // At the very bottom, the last section is the active one even if short.
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
      current = targets.length - 1;
    }
    links.forEach(function (link, i) {
      link.classList.toggle("active", i === current);
      if (i === current) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    });
  }

  window.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update);
  update();

  var collapse = document.getElementById("navbarCollapse");
  links.forEach(function (link) {
    link.addEventListener("click", function () {
      if (collapse && collapse.classList.contains("show") && window.bootstrap) {
        window.bootstrap.Collapse.getOrCreateInstance(collapse).hide();
      }
    });
  });
});
</script>
